name: Build & Release Pingus Android APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Pingus release version (e.g. 0.8.0-android1)'
        required: false
        default: '0.8.0-android1'
      publish_release:
        description: 'Publish GitHub release and update F-Droid'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        run: |
          mkdir -p $HOME/.android
          keytool -genkey -v -keystore $HOME/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug, OU=Debug, O=Debug, L=Debug, ST=Debug, C=Debug"
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0" "platforms;android-35" "ndk;27.2.12479018" || true

      - name: Setup Signing Keystore
        id: setup-keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Pingus APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          HAS_KEYSTORE: ${{ steps.setup-keystore.outputs.has_keystore }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        run: |
          chmod +x build-android.sh
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="0.8.0-android1"
          fi
          echo "Building Pingus version: ${VERSION}"
          echo "PINGUS_TAG=v${VERSION}" >> $GITHUB_ENV
          echo "PINGUS_VERSION=${VERSION}" >> $GITHUB_ENV

          if [ "$HAS_KEYSTORE" = "true" ]; then
            export KEYSTORE_FILE="${GITHUB_WORKSPACE}/release.jks"
          fi

          export TARGET_ABIS="arm64-v8a x86_64"
          ./build-android.sh "${VERSION}"
          rm -f release.jks

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pingus-apk
          path: build/output/pingus.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.PINGUS_TAG }}
          name: Pingus ${{ env.PINGUS_VERSION }} (Modernized for Android)
          body: |
            ### Pingus ${{ env.PINGUS_VERSION }} for Android
            Authentic open-source Lemmings-style puzzle game featuring penguins, modernized for Android:
            - **64-bit Performance**: Native binaries for `arm64-v8a` and `x86_64`.
            - **Mobile UI Auto-Scaling**: Interface, menus, and level elements automatically scale up for high-DPI smartphone displays (configurable in Options).
            - **Touch-Optimized Controls**: Drag empty areas to scroll/pan around levels, tap penguins to command actions.
            - **Full Audio**: Authentic sound effects and module music powered by OpenAL Soft & libmodplug.
            - **Modern Android & 16 KB Page Alignment**: Target SDK 35 with 16 KB page-size kernel compatibility for Android 15/16+.
          files: |
            build/output/pingus.apk
          generate_release_notes: false

      - name: Trigger Central F-Droid Index Rebuild
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.publish_release == 'true' || github.event.inputs.publish_release == true
        env:
          FDROID_TOKEN: ${{ secrets.FDROID_DISPATCH_TOKEN }}
        run: |
          if [ -n "$FDROID_TOKEN" ]; then
            echo "Triggering central fdroid-repo update workflow..."
            curl -L -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $FDROID_TOKEN" \
              https://api.github.com/repos/${{ github.repository_owner }}/fdroid-repo/dispatches \
              -d '{"event_type":"new-game-release","client_payload":{"repo":"${{ github.repository }}"}}'
          fi
